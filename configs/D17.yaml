# Full chain for tile D17: python -m src.nicfirecon run --config configs/D17.yaml
tile: D17
data_root: /mnt/warehouse/amazon     # NICFI in <data_root>/D17, Sentinel-2 in <data_root>/D17_S2

preprocess:                          # cloud masks -> post-check -> S2 monthly composites
  device: cuda

reconstruct:                         # one product per method, reconstructed/<method>/
  - {method: mask}
  - {method: s2fill, add_s2_bands: true}
  - {method: phenology, device: cuda}

composite:                           # outputs in composites/<type>/<stat>/<source>/
  - {type: typical-year, source: nicfi}                       # the reference for the figures
  - {type: annual, source: mask,      stat: median, min_score: 40}
  - {type: annual, source: s2fill,    stat: median, min_score: 40}
  - {type: annual, source: phenology, stat: median, min_score: 40}   # 40: keeps phenology's model values (score 45)
